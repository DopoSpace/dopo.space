name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type Check, Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Svelte type check
        run: pnpm check
        continue-on-error: true # TODO: fix pre-existing type errors

      - name: ESLint
        run: pnpm lint

      - name: Prettier format check
        run: pnpm format:check

  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters-long
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      APP_URL: http://localhost:5173
      NODE_ENV: test
      MAIN_DOMAIN: localhost:5173
      ADMIN_SUBDOMAIN: admin
      PAYPAL_CLIENT_ID: test-client-id
      PAYPAL_CLIENT_SECRET: test-client-secret
      PAYPAL_MODE: sandbox
      PAYPAL_WEBHOOK_ID: test-webhook-id
      MAILCHIMP_API_KEY: test-api-key
      MAILCHIMP_SERVER_PREFIX: us1
      MAILCHIMP_AUDIENCE_ID: test-audience-id
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run server tests
        run: pnpm test:server

  test-components:
    name: Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run component tests
        run: pnpm test:components
        continue-on-error: true # TODO: fix 2 failing tests in verify/page.test.ts
